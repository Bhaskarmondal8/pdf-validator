<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant PDF Verification</title>
    <!-- Stable CDN for PDF Processing -->
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f8; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #ffffff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 420px; text-align: center; }
        h1 { font-size: 20px; color: #1b5e20; margin-bottom: 8px; }
        p { font-size: 13px; color: #666; margin-bottom: 20px; }
        .upload-box { border: 2px dashed #a5d6a7; background: #f1f8e9; padding: 30px 15px; border-radius: 12px; cursor: pointer; margin-bottom: 15px; transition: 0.3s; }
        .upload-box:hover { background: #e8f5e9; }
        .btn { background: #2e7d32; color: #fff; padding: 12px 20px; border-radius: 8px; font-weight: 600; border: none; cursor: pointer; font-size: 15px; display: inline-block; }
        #status { margin-top: 15px; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 13px; display: none; }
        .info { background: #e3f2fd; color: #0288d1; }
        .success { background: #e8f5e9; color: #1b5e20; }
        .error { background: #ffebee; color: #c62828; }
        .ad-space { background: #fff3e0; border: 1px dashed #ffb74d; padding: 10px; text-align: center; font-size: 11px; color: #e65100; border-radius: 6px; margin: 12px 0; }
    </style>
</head>
<body>

<div class="card">
    <h1>📄 PDF Verification Portal</h1>
    <p>Upload PDF to add Verified Stamp</p>

    <div class="ad-space">[ AdSense Banner ]</div>

    <div class="upload-box" onclick="document.getElementById('pdfInput').click()">
        <div style="font-size: 36px; margin-bottom: 8px;">📥</div>
        <div class="btn">Select PDF File</div>
        <input type="file" id="pdfInput" accept="application/pdf" style="display: none;">
    </div>

    <div id="status"></div>

    <div class="ad-space">[ AdSense Banner ]</div>
</div>

<script>
    document.getElementById('pdfInput').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const status = document.getElementById('status');
        status.style.display = 'block';
        status.className = 'info';
        status.innerText = '⚡ Processing Document...';

        try {
            const arrayBuffer = await file.arrayBuffer();
            
            // Checking PDFLib object safely
            const lib = window.PDFLib || PDFLib;
            if (!lib) {
                throw new Error("Library failed to load");
            }

            const pdfDoc = await lib.PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
            const pages = pdfDoc.getPages();
            
            if (!pages || pages.length === 0) {
                throw new Error("Empty PDF");
            }

            const firstPage = pages[0];
            const font = await pdfDoc.embedFont(lib.StandardFonts.HelveticaBold);
            const greenColor = lib.rgb(0.08, 0.5, 0.24);

            // Stamp Box Design
            firstPage.drawRectangle({
                x: 20,
                y: 20,
                width: 210,
                height: 44,
                color: lib.rgb(0.93, 0.98, 0.94),
                borderColor: greenColor,
                borderWidth: 1.5,
            });

            firstPage.drawText('✔ Signature Verified', {
                x: 30,
                y: 46,
                size: 11,
                font: font,
                color: greenColor,
            });

            firstPage.drawText('Digitally Signed & Validated', {
                x: 30,
                y: 32,
                size: 8,
                font: font,
                color: lib.rgb(0.2, 0.2, 0.2),
            });

            const pdfBytes = await pdfDoc.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "Verified_" + file.name;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            status.className = 'success';
            status.innerText = '✔ Success! Verified PDF Downloaded.';

        } catch (err) {
            console.error("PDF Error:", err);
            status.className = 'error';
            status.innerText = '❌ Failed to process PDF. Try another file.';
        }
    });
</script>

</body>
</html>
