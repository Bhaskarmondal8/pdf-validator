<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant PDF Signature Validator</title>
    <style>
        :root {
            --primary: #1b5e20;
            --primary-light: #2e7d32;
            --bg: #f4f7f6;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            text-align: center;
        }
        h1 { font-size: 20px; color: var(--primary); margin-bottom: 8px; }
        p.subtitle { font-size: 13px; color: #666; margin-bottom: 20px; }
        .upload-area {
            border: 2px dashed #a5d6a7;
            background: #f1f8e9;
            padding: 25px 15px;
            border-radius: 12px;
            cursor: pointer;
        }
        .btn {
            background: var(--primary-light);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            margin-top: 15px;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
            font-weight: 600;
        }
        .success { background: #e8f5e9; color: var(--primary); border-left: 5px solid var(--primary); }
        .error { background: #ffebee; color: #c62828; border-left: 5px solid #c62828; }
        .ad-banner {
            width: 100%;
            background: #fff3e0;
            border: 1px dashed #ffb74d;
            padding: 10px;
            text-align: center;
            font-size: 12px;
            color: #e65100;
            border-radius: 6px;
            margin: 15px 0;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>📱💻 One-Click PDF Signature Validator</h1>
    <p class="subtitle">Aadhaar & Certificate Green Tick Converter</p>

    <div class="ad-banner">[ AdSense Top Banner Space ]</div>

    <div class="upload-area" onclick="document.getElementById('pdfInput').click()">
        <div style="font-size: 36px;">📄</div>
        <div style="font-size: 15px; font-weight: bold; margin-top: 8px;">Select Signed PDF</div>
        <button class="btn">Choose File</button>
        <input type="file" id="pdfInput" accept=".pdf" style="display: none;">
    </div>

    <div id="status"></div>

    <div class="ad-banner">[ AdSense Bottom Banner Space ]</div>
</div>

<script>
    document.getElementById('pdfInput').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const statusDiv = document.getElementById('status');
        statusDiv.style.display = 'block';
        statusDiv.className = 'success';
        statusDiv.innerHTML = '🔄 Reading Signature & Validating...';

        const formData = new FormData();
        formData.append('pdf', file);

        try {
            const response = await fetch('/validate-pdf', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error('Conversion failed');

            const blob = await response.blob();
            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = "Verified_" + file.name;
            document.body.appendChild(a);
            a.click();
            a.remove();

            statusDiv.innerHTML = '✔ Verified Successfully! Downloading Green Tick PDF...';
        } catch (err) {
            statusDiv.className = 'error';
            statusDiv.innerHTML = '❌ Processing failed. Please select a valid PDF.';
        }
    });
</script>

</body>
</html>
